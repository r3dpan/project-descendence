openapi: 3.1.2
info:
  title: Descendence API
  description: Basic api provided by the descendence api server
  version: v0.0.1
servers:
- url: http://127.0.0.1:8080
  description: Local development server for testing
paths:
  /:
    get:
      operationId: getAPIServerInfo
      responses:
        "200":
          description: Returns general information about the api server
          content:
            application/json:
              schema:
                type: object
                properties:
                  productName:
                    type: string
                  productBuild:
                    type: string
                  apiVersion:
                    type: string
                required:
                  - productName
                  - productBuild
                  - apiVersion
  /healthz:
    get:
      operationId: getAPIServerHealth
      responses:
        "200":
          description: Api server and database are both reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerHealth"
        "503":
          description: Api server is up but the database is not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerHealth"
  /api/v1/whoami:
    get:
      operationId: getWhoAmI
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The principal resolved from the Authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runs:
    post:
      operationId: createRun
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreate"
      responses:
        "202":
          description: >
            Run accepted and queued. Never blocks on the container finishing -
            poll GET /api/v1/runs/{id} for the outcome. A repeated
            Idempotency-Key for the same principal returns the original run
            rather than creating a second one.
          headers:
            Location:
              description: "/api/v1/runs/{id} of the created (or original, if replayed) run"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Validation failed (e.g. empty argv, non-positive timeout)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listRuns
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's nextCursor. Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum runs to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: >
            Runs in descending queued_at order (newest first), keyset-paginated -
            never offset-based, since the table grows forever and offset
            pagination skips rows under concurrent inserts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          description: Malformed cursor, or limit outside 1-200
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runs/{id}:
    get:
      operationId: getRun
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runs/{id}/cancel:
    post:
      operationId: cancelRun
      description: >
        Request cancellation of a run.


        Always 202, never 200, because what happens next depends on the run's
        state and the caller cannot control which. A **queued** run has no
        container, so it is cancelled outright and is already terminal in the
        response body. A **running** run belongs to the supervisor, which is
        the only process that may stop a container, so the request is recorded
        and the run is still running when this returns - poll or stream for the
        outcome, as after creating a run.


        Repeating the request on a run already being cancelled is not an error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: >
            Cancellation accepted. The run's `state` says which of the two
            happened: `cancelled` if it was queued and is now terminal,
            `running` if the supervisor still has to stop it -
            `cancelRequestedAt` is set either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            The run has already reached a terminal state. Terminal states are
            final, so there is nothing left to cancel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runs/{id}/logs:
    get:
      operationId: getRunLogs
      description: >
        A run's captured output, oldest first. Paginated by sequence number
        rather than an opaque cursor: unlike the runs list, a log line's
        position is meaningful and public - it is the same number an SSE
        client sends back as Last-Event-ID to resume.


        Two representations, chosen by Accept. The default is one JSON page of
        history. `Accept: text/event-stream` instead follows the run live,
        sending the history first and then each line as it is captured, until
        the run reaches a terminal state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Last-Event-ID
          in: header
          description: >
            Resume an event stream after this sequence number. Sent
            automatically by EventSource on reconnect. Overrides `after`, which
            on a reconnect still holds whatever the stream was originally
            opened with - honouring it would replay the whole run every time.
            Ignored on the JSON representation.
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          description: >
            Return lines strictly after this sequence number. Omit or pass 0
            for the beginning of the run.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: >
            Maximum lines to return. Applies to the JSON representation only -
            an event stream is not paginated, it runs until the run ends.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: >
            One page of the run's output, or a live event stream of it,
            depending on Accept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunLogList"
            text/event-stream:
              schema:
                type: string
              description: >
                Server-sent events. Two event types:


                `log` - one line of output. Its `id` is the line's sequence
                number, and its data is a RunLogLine object.


                `state` - the run's state, sent when the stream opens and on
                every change after that. Data is `{"runState": "..."}`. No
                `id`: it is not a position to resume from.


                A `state` event carrying a terminal state is the stream's
                defined ending, and the server closes the connection after it.
                A stream that ends any other way ended abnormally; reconnect
                and resume from the last `log` id received.
              example: |
                retry: 3000

                id: 1
                event: log
                data: {"seq":1,"stream":"stdout","ts":"2026-08-05T12:00:00Z","text":"hello"}

                event: state
                data: {"runState":"succeeded"}
        "400":
          description: >
            Negative after, limit outside 1-1000, or a non-numeric
            Last-Event-ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No run with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: >
            The run still exists, but its output has passed the retention
            window and been deleted. Distinct from an empty 200, which means
            the run genuinely printed nothing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/repos:
    post:
      operationId: createRepo
      description: >
        Create an empty bare repository for job definitions.


        The repository is created on disk first and recorded second: a record
        pointing at a directory that does not exist is a repository nothing can
        read, whereas a directory with no record is merely orphaned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoCreate"
      responses:
        "201":
          description: The repository, now empty and with no commits
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          description: The name is empty, too long, or contains characters that cannot be a directory name
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A repository directory of that name already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listRepos
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Repositories ordered by name, keyset-paginated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "400":
          description: Malformed cursor, or limit outside 1-200
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/repos/{id}:
    get:
      operationId: getRepo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No repository with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/repos/{id}/sync:
    post:
      operationId: syncRepo
      description: >
        Rebuild the job list from the repository's manifests.


        A full rebuild every time, never a diff against what was seen last:
        every `*.job.yaml` at the default branch's HEAD is parsed and upserted,
        and jobs whose manifest is gone are soft-deleted.


        200 even when individual manifests failed. A scan of ten manifests
        where one has a typo is not a failed request - nine jobs updated
        correctly, and the response says which one did not and why. A manifest
        that cannot be parsed is reported and skipped, never deleted: it is
        still in the repository, the platform simply cannot read it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: What the scan changed, including any manifests it could not read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No repository with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/repos/{id}/files:
    post:
      operationId: createRepoFile
      description: >
        Commit one file into a repository, then sync.


        This is what makes the API an *editor* for the files git owns, and it
        is the only way to change a job's definition - there is no endpoint
        that edits a job's manifest-derived fields. The commit is attributed to
        the calling principal, so a script that arrived through the API is
        traceable to a token the same way a run is.


        A sync follows immediately, so a job uploaded this way is runnable when
        the call returns rather than when someone remembers to scan.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoFileCreate"
      responses:
        "201":
          description: The commit, and the sync that followed it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoFileResult"
        "400":
          description: >
            The path is empty, absolute, or escapes the repository root; or the
            body is larger than 1MiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No repository with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/jobs:
    get:
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: >
            Live jobs ordered by name, keyset-paginated. Ordered by name rather
            than by time because a job list is a catalogue, not a timeline -
            the opposite of the runs list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "400":
          description: Malformed cursor, or limit outside 1-200
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      description: >
        Returns the job, including one whose manifest has been removed - a run
        pointing at a deleted job must still be explainable.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No job with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: patchJob
      description: >
        Enable or disable a job.


        `enabled` is the only field of a job the API can change, because it is
        the only one this installation owns rather than the repository. Every
        other field comes from the manifest; to change one, commit the manifest
        (POST /api/v1/repos/{id}/files) and sync.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPatch"
      responses:
        "200":
          description: The updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Malformed body, or a field other than `enabled` was supplied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No live job with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/jobs/{id}/runs:
    post:
      operationId: createJobRun
      description: >
        Trigger a job.


        The request carries no execution detail: what to run is the manifest's
        business. The server resolves the repository's current commit, reads
        the manifest *at that commit*, and records the resolved image, argv and
        commit SHA onto the run - so the branch moving a moment later cannot
        change what this run executes.


        202 with a Location header, like every other way of creating a run.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: >
            Run accepted and queued, with jobId and commitSha already set. A
            repeated Idempotency-Key returns the original run.
          headers:
            Location:
              description: "/api/v1/runs/{id} of the created (or original, if replayed) run"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No job with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            The job cannot be run as it stands: it is disabled, its manifest
            has been removed from the repository, the repository has no
            commits, the manifest is missing or invalid at the current
            commit, or the manifest names a runtime that is not defined, not
            yet built, or whose image has been pruned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/jobs/{id}/schedules:
    post:
      operationId: createSchedule
      description: >
        Create a schedule for a job (task 5.7, decision #27). A plain
        Postgres write - the supervisor's schedule-sync loop picks up the
        new row asynchronously and renders the generated systemd
        `.timer`/`.service` unit pair that actually fires it. cronExpr is
        standard 5-field cron syntax, translated to systemd's OnCalendar= by
        a deliberately conservative subset (single value, `*`, simple `*/N`
        steps, comma-lists); anything else is rejected here with a specific
        reason before it ever reaches the database.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Schedule created
          headers:
            Location:
              description: "/api/v1/schedules/{id} of the created schedule"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Malformed body, unsupported cronExpr syntax, invalid timezone, or an invalid catchUpPolicy/overlapPolicy value
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No job with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The job's manifest has been removed from the repository
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listSchedulesByJob
      description: >
        A job's schedules. No pagination - a job's schedule count is small
        at this scale.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The job's schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No job with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/schedules/{id}:
    get:
      operationId: getSchedule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No schedule with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: patchSchedule
      description: >
        Update a schedule. Fields omitted from the body keep their current
        value. Re-validated the same way creation is; on success the
        supervisor's schedule-sync loop regenerates the unit pair on its
        next tick.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePatch"
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Malformed body, unsupported cronExpr syntax, invalid timezone, or an invalid catchUpPolicy/overlapPolicy value
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No schedule with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteSchedule
      description: >
        Hard delete - a schedule is operator-owned data, not a git
        projection. Past runs this schedule created stay explainable
        (runs.scheduleId points at nothing, not nowhere useful).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Schedule deleted
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No schedule with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/schedules/{id}/trigger:
    post:
      operationId: triggerSchedule
      description: >
        Fire a schedule (task 5.3/5.6). This is what a generated schedule's
        `.service` unit calls, via `descendence schedule trigger <id>`, when
        its `.timer` fires - not normally called directly by an operator,
        though nothing prevents it for testing.


        Requires the `run` scope - the first endpoint in this API to
        actually enforce one (a narrow, deliberate exception; see
        ARCHITECTURE.md decision #27).


        If the schedule's overlapPolicy is `skip` and the run it created
        last time has not reached a terminal state, this returns `200` with
        `skipped: true` rather than creating a run - the schedule fired
        exactly as designed, which is not a failure (a `409` here would show
        as a failed unit in `systemctl --user status` for an entirely
        expected outcome).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Skipped - the overlap policy chose not to create a run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTriggerResult"
        "202":
          description: Run created
          headers:
            Location:
              description: "/api/v1/runs/{id} of the created run"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTriggerResult"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Principal is missing the run scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No schedule with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The schedule is disabled, its job no longer exists, or the job cannot be run as it stands (see createJobRun's 409)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runtimes:
    get:
      operationId: listRuntimes
      description: >
        Runtimes, keyset-paginated by name - a catalogue, like jobs, not a
        timeline.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Runtimes ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeList"
        "400":
          description: Malformed cursor, or limit outside 1-200
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createRuntime
      description: >
        Define a runtime. Unlike a job, a runtime is not authored in git - it
        is a built artifact, created and rebuilt directly through this API
        (ARCHITECTURE.md §4.4).


        Leaving the row's build status at its default of `pending` queues the
        first build immediately; the supervisor's build claim loop picks it
        up on its next tick. Poll GET /api/v1/runtimes/{id} for buildStatus.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeCreate"
      responses:
        "202":
          description: Runtime created, its first build already queued
          headers:
            Location:
              description: "/api/v1/runtimes/{id} of the created runtime"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runtime"
        "400":
          description: Malformed body, missing/invalid lang, or an unrenderable definition
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A runtime with this name already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runtimes/{id}:
    get:
      operationId: getRuntime
      description: >
        Returns the runtime. Also the poll target for an async build (task
        4.5): buildStatus and buildError live directly on this row, so there
        is no separate build resource.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runtime"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No runtime with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runtimes/{id}/build:
    post:
      operationId: buildRuntime
      description: >
        Queue a rebuild of an existing runtime. There is one build slot per
        runtime - unlike runs, which queue freely - so a repeat call while a
        build is pending or building is rejected rather than silently queuing
        a second one.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Build queued
          headers:
            Location:
              description: "/api/v1/runtimes/{id} of the runtime being built"
              schema:
                type: string
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No runtime with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A build is already pending or building for this runtime
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/runtimes/prune:
    post:
      operationId: pruneRuntimes
      description: >
        Reclaim runtime image storage (task 4.7). Exactly one of `ids`
        (prune these specific runtimes now, regardless of age or use) or
        `olderThanDays` (prune every built, not-yet-pruned runtime unused by
        any run started in that window and by any live job) must be set.


        The runtime row always survives - only the image is deleted and
        imagePrunedAt is set, mirroring how run records outlive their pruned
        logs. The supervisor's hourly sweep applies the same "unused" rule
        automatically; this endpoint is the manual trigger for the same
        policy, not a different one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimePrune"
      responses:
        "200":
          description: >
            What happened, per runtime: pruned, skipped (not built, or
            already pruned), or errored (e.g. the image delete failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePruneResult"
        "400":
          description: Malformed body, or neither/both of ids and olderThanDays set
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >
        Scoped per principal. A retried request with the same key returns the
        original run instead of creating a second one.
      schema:
        type: string
  schemas:
    ServerHealth:
      type: object
      properties:
        healthStatus:
          type: string
        databaseUp:
          type: boolean
        podmanUp:
          type: boolean
      required:
        - healthStatus
        - databaseUp
        - podmanUp
    Principal:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [user, token]
        scopes:
          type: array
          items:
            type: string
            enum: [read, run, admin]
      required:
        - id
        - name
        - kind
        - scopes
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      required:
        - type
        - title
        - status
    RunCreate:
      type: object
      properties:
        imageRef:
          type: string
          description: OCI image reference, e.g. "docker.io/library/alpine:latest"
        argv:
          type: array
          items:
            type: string
          minItems: 1
          description: >
            Executed as-is, never interpolated into a shell string - a value
            like "; rm -rf /" is passed through literally and harmlessly.
        timeoutSeconds:
          type: integer
          minimum: 1
          default: 3600
      required:
        - imageRef
        - argv
    Run:
      type: object
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, lost]
        imageRef:
          type: string
        argv:
          type: array
          items:
            type: string
        timeoutSeconds:
          type: integer
        containerId:
          type: [string, "null"]
        exitCode:
          type: [integer, "null"]
        failureReason:
          type: [string, "null"]
        cancelRequestedAt:
          description: >
            When cancellation was requested. Set before the run is actually
            cancelled - a running run's container still has to be stopped by
            the supervisor - so a run can be `running` with this set, meaning
            "on its way out". Also kept on a run that finished on its own
            before the request landed, which is the case worth being able to
            explain afterwards.
          type: [string, "null"]
          format: date-time
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        jobId:
          description: >
            The job this run came from, or null for an ad-hoc run created by
            POST /api/v1/runs. A job may since have been removed from its
            repository; the run still points at it, so that what ran remains
            explainable.
          type: [integer, "null"]
        commitSha:
          description: >
            The exact commit the job's manifest and script were read from,
            resolved when the run was created and never re-resolved. Together
            with jobId this is what makes a past run reproducible: check this
            commit out and you have precisely what executed. Null for an
            ad-hoc run.
          type: [string, "null"]
        runtimeId:
          description: >
            Set when the job named a runtime rather than an image directly
            (task 4.6). Resolved once, at creation, from the runtime's
            current image digest - rebuilding the runtime afterwards never
            changes this run's imageDigest.
          type: [integer, "null"]
        imageDigest:
          description: The runtime's image digest at the moment this run was created. Null for an ad-hoc run or a job that names an image directly.
          type: [string, "null"]
        scheduleId:
          description: Set only for a run POST /api/v1/schedules/{id}/trigger created (task 5.6). Null for both ad-hoc and ordinary job runs.
          type: [integer, "null"]
      required:
        - id
        - state
        - imageRef
        - argv
        - timeoutSeconds
        - queuedAt
    RunList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          description: Opaque cursor for the next page. Absent (or null) on the last page.
          type: [string, "null"]
      required:
        - items
    RunLogLine:
      type: object
      description: >
        One captured line of output. Sequence numbers are per run and dense
        from 1, covering both streams - they record the order output arrived,
        which is not always the order the script printed it, since stdout and
        stderr are buffered independently inside the container.
      properties:
        seq:
          type: integer
        stream:
          type: string
          enum: [stdout, stderr]
        ts:
          type: string
          format: date-time
        text:
          description: The line without its terminating newline.
          type: string
      required:
        - seq
        - stream
        - ts
        - text
    RunLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunLogLine"
        nextAfter:
          description: >
            Pass as `after` to fetch the next page. Absent (or null) when the
            page returned everything currently available - which is not the
            same as the run being over, so check runState before concluding
            there is nothing more to come.
          type: [integer, "null"]
        runState:
          description: >
            The run's state as of this response. Included so a client polling
            for output does not need a second request to learn whether more
            output is still possible.
          type: string
          enum: [queued, running, succeeded, failed, cancelled, lost]
      required:
        - items
        - runState
    Repo:
      type: object
      description: >
        A bare git repository holding job definitions. The api is its sole
        writer; the supervisor only reads a script blob at a commit a run has
        pinned.
      properties:
        id:
          type: integer
        name:
          description: >
            Unique, and used as the directory name under GIT_REPO_DIR, so it
            is constrained to letters, digits, dots, dashes and underscores.
          type: string
        path:
          description: Where the repository lives on disk.
          type: string
        kind:
          type: string
          enum: [local, external]
        defaultBranch:
          description: >
            The branch a scan reads and a job run resolves against. Recorded
            per repository rather than assumed globally.
          type: string
        remoteUrl:
          description: Always null for a local repository. External repositories are deferred.
          type: [string, "null"]
        lastSyncedAt:
          description: >
            What the last scan saw. Reported for the operator's benefit and
            never used as an input to the next scan, which always re-reads
            HEAD - trusting a stored "last seen" would make a half-failed sync
            invisible to the one after it.
          type: [string, "null"]
          format: date-time
        lastSyncedCommitSha:
          type: [string, "null"]
      required:
        - id
        - name
        - path
        - kind
        - defaultBranch
    RepoCreate:
      type: object
      properties:
        name:
          type: string
        defaultBranch:
          description: Defaults to "main" when omitted.
          type: string
      required:
        - name
    RepoList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
        nextCursor:
          description: Opaque cursor for the next page. Absent (or null) on the last page.
          type: [string, "null"]
      required:
        - items
    RepoFileCreate:
      type: object
      properties:
        path:
          description: >
            Where the file goes in the repository, relative to its root. May
            not be absolute or escape the root.
          type: string
        content:
          description: The file's contents. The whole request body is capped at 1MiB.
          type: string
        message:
          description: Commit message. Defaults to "Update <path>".
          type: string
      required:
        - path
        - content
    RepoFileResult:
      type: object
      properties:
        path:
          type: string
        commitSha:
          description: The commit this file was written as.
          type: string
        sync:
          $ref: "#/components/schemas/SyncResult"
      required:
        - path
        - commitSha
    SyncResult:
      type: object
      description: >
        What a scan did. Job names rather than ids, because a sync is something
        an operator reads.
      properties:
        commitSha:
          description: >
            The commit the projection was rebuilt from. Empty when the
            repository has no commits yet, which is not an error.
          type: string
        added:
          type: array
          items:
            type: string
        updated:
          type: array
          items:
            type: string
        removed:
          description: >
            Jobs whose manifest is no longer in the repository. They are
            soft-deleted, not removed, so runs that used them stay explainable.
          type: array
          items:
            type: string
        errors:
          description: >
            Manifests that could not be read. Each is reported and skipped -
            never fatal to the scan, and never destructive to the job it names,
            since an unreadable manifest is still present in the repository.
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - commitSha
        - added
        - updated
        - removed
        - errors
    Job:
      type: object
      description: >
        A job is a script's interface - what to run, how to invoke it, and
        (from later phases) what parameters it takes and how they are
        presented. It is authored as a `<name>.job.yaml` manifest in git,
        versioned alongside the script it describes.


        This resource is a **projection** of that manifest, rebuilt by a scan.
        Every field below except `enabled` is owned by git and rewritten by the
        next sync, which is why there is no endpoint that edits one: to change
        a job, commit its manifest.
      properties:
        id:
          type: integer
        repoId:
          type: integer
        name:
          description: Unique among live jobs, and how a job is addressed on the command line.
          type: string
        description:
          type: [string, "null"]
        manifestPath:
          description: >
            Where the manifest lives in the repository. Immutable for a given
            job: a job is keyed on (repository, manifest path), so moving a
            manifest soft-deletes one job and creates another.
          type: string
        scriptPath:
          description: >
            Repository-root-relative, resolved from the manifest's own
            directory - a manifest and its script are a unit that can be moved
            or copied together.
          type: string
        command:
          description: >
            Null in the usual case, meaning argv is the script's own path and
            its shebang chooses the interpreter. Set only when the manifest
            overrides the invocation.
          type: [array, "null"]
          items:
            type: string
        imageRef:
          description: >
            A plain OCI reference, used as-is. Nullable: a manifest names
            exactly one of `image:` or `runtime:` (task 4.6), so exactly one
            of imageRef/runtimeId is set.
          type: [string, "null"]
        runtimeId:
          description: >
            Set when the manifest names a runtime with `runtime:` instead of
            an image directly. A run created from this job resolves the
            runtime's current image digest at creation time and pins it -
            rebuilding the runtime afterwards never changes what an
            already-created run executes.
          type: [integer, "null"]
        timeoutSeconds:
          description: Null when the manifest does not say, in which case the platform default applies.
          type: [integer, "null"]
        params:
          description: >
            The parameter contract (task 6.1), in manifest order. Empty when
            the manifest has no `params:` block. Authoritative for what
            POST /api/v1/jobs/{id}/runs accepts in its `params` body.
          type: array
          items:
            $ref: "#/components/schemas/JobParam"
        enabled:
          description: >
            The one field git does not own. A sync never changes it, so
            pausing a misbehaving job is not something the next scan undoes.
          type: boolean
        syncedCommitSha:
          description: Which commit this row was built from.
          type: string
        deletedAt:
          description: >
            Set when the manifest has been removed from the repository. Such a
            job cannot be run and does not appear in listings, but the record
            survives so that runs which used it remain explainable. Restoring
            the manifest resurrects this same job, with its run history.
          type: [string, "null"]
          format: date-time
      required:
        - id
        - repoId
        - name
        - manifestPath
        - scriptPath
        - params
        - enabled
        - syncedCommitSha
    JobParam:
      type: object
      description: One entry of a job's parameter contract (task 6.1).
      properties:
        name:
          type: string
        type:
          description: >
            "mount" delivers its value via a Podman secret file (task 6.6)
            rather than as a JSON scalar in params.json.
          type: string
          enum: [string, number, bool, mount]
        required:
          description: >
            False whenever the manifest set `required: false`, or whenever a
            default is present - a param with a default is never missing.
          type: boolean
        default:
          description: The manifest's raw default, or null when it gave none.
          type: [string, "null"]
        secret:
          description: >
            Redacted from anything the API returns about a run (task 6.5).
            Every mount-type param is treated as secret regardless of this
            flag.
          type: boolean
      required:
        - name
        - type
        - required
        - secret
    JobList:
      type: object
      properties:
        items:
          description: Live jobs only, ordered by name.
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          description: Opaque cursor for the next page. Absent (or null) on the last page.
          type: [string, "null"]
      required:
        - items
    JobPatch:
      type: object
      description: >
        The only mutation the API performs on a job. Everything else about a
        job is defined by its manifest in git.
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    Schedule:
      type: object
      description: >
        Fires a job on a cron schedule (ARCHITECTURE.md §4.8, decision #27).
        Unlike a job, a schedule is not authored in git - operator-owned
        data, created and changed only through this API. Firing itself is
        done by a generated systemd (user) timer, not this row directly;
        the supervisor's schedule-sync loop keeps the two in agreement.
      properties:
        id:
          type: integer
        jobId:
          type: integer
        cronExpr:
          description: >
            Standard 5-field cron syntax (minute hour dom month dow).
            Deliberately scoped to what translates cleanly to systemd's
            OnCalendar= syntax: single values, `*`, simple `*/N` steps and
            comma-lists. Range syntax (1-5) and combined day-of-month +
            day-of-week restrictions are rejected outright.
          type: string
        timezone:
          description: IANA timezone name. Defaults to UTC.
          type: string
        catchUpPolicy:
          description: >
            What happens if a fire is missed while nothing was around to
            fire it (task 5.4). `skip` (default) does nothing; `catch_up`
            fires once to catch up, never once per missed occurrence -
            mapped directly onto the generated timer's Persistent=.
          type: string
          enum: [skip, catch_up]
        overlapPolicy:
          description: >
            What happens when a fire is due but the run this schedule
            created last time has not reached a terminal state (task 5.6).
            `skip` (default) does not create a new run. `queue` and
            `concurrent` currently behave identically - the supervisor
            executes runs strictly one at a time today, so a "concurrent"
            firing still just queues a second run behind the first.
          type: string
          enum: [skip, queue, concurrent]
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nextDueAt:
          description: >
            Informational only - an estimate, not what actually drives
            firing (systemd does, from the generated unit). Null if it
            cannot currently be computed.
          type: [string, "null"]
          format: date-time
      required:
        - id
        - jobId
        - cronExpr
        - timezone
        - catchUpPolicy
        - overlapPolicy
        - enabled
        - createdAt
        - updatedAt
    ScheduleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
      required:
        - items
    ScheduleCreate:
      type: object
      properties:
        cronExpr:
          type: string
        timezone:
          description: Optional; defaults to UTC.
          type: string
        catchUpPolicy:
          description: Optional; defaults to skip.
          type: string
          enum: [skip, catch_up]
        overlapPolicy:
          description: Optional; defaults to skip.
          type: string
          enum: [skip, queue, concurrent]
        enabled:
          description: Optional; defaults to true.
          type: boolean
      required:
        - cronExpr
    SchedulePatch:
      type: object
      description: Fields omitted keep their current value.
      properties:
        cronExpr:
          type: string
        timezone:
          type: string
        catchUpPolicy:
          type: string
          enum: [skip, catch_up]
        overlapPolicy:
          type: string
          enum: [skip, queue, concurrent]
        enabled:
          type: boolean
    ScheduleTriggerResult:
      type: object
      properties:
        skipped:
          description: True when the overlap policy chose not to create a run.
          type: boolean
        reason:
          description: Set only when skipped is true.
          type: string
        run:
          description: Set only when skipped is false.
          $ref: "#/components/schemas/Run"
      required:
        - skipped
    Runtime:
      type: object
      description: >
        A built container image: curated base image, system packages, and
        one language's dependency manifest (ARCHITECTURE.md §4.4). Unlike a
        job, this is not authored in git - every field is owned by Postgres
        directly and changed only through this API.
      properties:
        id:
          type: integer
        name:
          description: Unique. How a job manifest's `runtime:` key addresses this row.
          type: string
        baseImage:
          type: string
        sysPackages:
          type: array
          items:
            type: string
        lang:
          type: string
          enum: [python, powershell, node]
        langManifest:
          description: >
            The language ecosystem's own manifest format verbatim -
            requirements.txt for python, a PSResourceGet file for
            powershell, package.json for node. Null means no language
            dependencies, just the base image and system packages.
          type: [string, "null"]
        inputHash:
          description: >
            Hash of (baseImage, sysPackages, lang, langManifest). Doubles as
            the local image tag, so two runtimes with identical inputs
            dedupe onto the same built image even under different names.
          type: string
        buildStatus:
          type: string
          enum: [pending, building, ready, failed]
        imageDigest:
          description: Set once buildStatus reaches ready.
          type: [string, "null"]
        buildError:
          description: Set when buildStatus is failed.
          type: [string, "null"]
        builtAt:
          type: [string, "null"]
          format: date-time
        imagePruned:
          description: >
            True once the image has been reclaimed (task 4.7). The row
            survives regardless - what was built, from which inputs, when,
            stays answerable - but a job naming this runtime cannot run
            until it is rebuilt.
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - baseImage
        - sysPackages
        - lang
        - inputHash
        - buildStatus
        - imagePruned
        - createdAt
    RuntimeList:
      type: object
      properties:
        items:
          description: Runtimes ordered by name.
          type: array
          items:
            $ref: "#/components/schemas/Runtime"
        nextCursor:
          description: Opaque cursor for the next page. Absent (or null) on the last page.
          type: [string, "null"]
      required:
        - items
    RuntimeCreate:
      type: object
      properties:
        name:
          type: string
        baseImage:
          description: Optional; defaults to a curated image for `lang` (decision #25, Debian-based).
          type: string
        sysPackages:
          type: array
          items:
            type: string
        lang:
          type: string
          enum: [python, powershell, node]
        langManifest:
          description: See Runtime.langManifest. Optional.
          type: string
      required:
        - name
        - lang
    RuntimePrune:
      type: object
      description: Exactly one of `ids` or `olderThanDays` must be set.
      properties:
        ids:
          description: Prune these specific runtimes now, regardless of age or use.
          type: array
          items:
            type: integer
        olderThanDays:
          description: >
            Prune every built, not-yet-pruned runtime unused by any run
            started within this many days and by any live job.
          type: integer
          minimum: 0
    RuntimePruneResult:
      type: object
      properties:
        pruned:
          description: Names of runtimes whose image was deleted by this call.
          type: array
          items:
            type: string
        skipped:
          description: "Names with a reason, e.g. \"not built\" or \"already pruned\"."
          type: array
          items:
            type: string
        errors:
          description: "Names with a reason the delete itself failed."
          type: array
          items:
            type: string
      required:
        - pruned
        - skipped
        - errors
