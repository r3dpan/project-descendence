openapi: 3.1.2
info:
  title: Descendence API
  description: Basic api provided by the descendence api server
  version: v0.0.1
servers:
- url: http://127.0.0.1:8080
  description: Local development server for testing
paths:
  /:
    get:
      operationId: getAPIServerInfo
      responses:
        "200":
          description: Returns general information about the api server
          content:
            application/json:
              schema:
                type: object
                properties:
                  productName:
                    type: string
                  productBuild:
                    type: string
                  apiVersion:
                    type: string
                required:
                  - productName
                  - productBuild
                  - apiVersion
  /healthz:
    get:
      operationId: getAPIServerHealth
      responses:
        "200":
          description: Api server and database are both reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerHealth"
        "503":
          description: Api server is up but the database is not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerHealth"
  /api/v1/whoami:
    get:
      operationId: getWhoAmI
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The principal resolved from the Authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: Missing, malformed, unknown, expired or revoked token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ServerHealth:
      type: object
      properties:
        healthStatus:
          type: string
        databaseUp:
          type: boolean
      required:
        - healthStatus
        - databaseUp
    Principal:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [user, token]
        scopes:
          type: array
          items:
            type: string
            enum: [read, run, admin]
      required:
        - id
        - name
        - kind
        - scopes
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      required:
        - type
        - title
        - status