openapi: 3.1.2
info:
  title: Descendence API
  description: Basic api provided by the descendence api server
  version: v0.0.1
servers:
- url: http://127.0.0.1:8080
  description: Local development server for testing
paths:
  /:
    get:
      operationId: getAPIServerInfo
      responses:
        "200":
          description: Returns general information about the api server
          content:
            application/json:
              schema:
                type: object
                properties:
                  productName:
                    type: string
                  productBuild:
                    type: string
                  apiVersion:
                    type: string
                required:
                  - productName
                  - productBuild
                  - apiVersion
  /healthz:
    get:
      operationId: getAPIServerHealth
      responses:
        "200":
          description: Returns health status of the api server
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthStatus:
                    type: string
                required:
                  - healthStatus